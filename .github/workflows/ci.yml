name: PHP SDK
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Both results are wanted: a failure on one version must not hide
      # whether the floor still works.
      fail-fast: false
      matrix:
        # 8.2 is the supported floor; the rest guard against drift. 8.1 gets no
        # security fixes from the PHP project, CVE-2026-109618 and -109619 included.
        php: ["8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer validate --strict
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpstan analyse --no-progress

  # The adapters are exercised against every framework major they claim,
  # each on the oldest PHP that major supports.
  adapters:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: "8.2", laravel: "^10.0", symfony: "^6.4" }
          - { php: "8.2", laravel: "^11.0", symfony: "^7.0" }
          - { php: "8.3", laravel: "^12.0", symfony: "^7.0" }
          - { php: "8.4", laravel: "^13.0", symfony: "^8.0" }
    name: adapters (Laravel ${{ matrix.laravel }}, Symfony ${{ matrix.symfony }}, PHP ${{ matrix.php }})
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: none
      - name: pin the framework majors
        run: |
          composer require --dev --no-update --no-interaction \
            "illuminate/http:${{ matrix.laravel }}" \
            "symfony/http-kernel:${{ matrix.symfony }}" \
            "symfony/var-dumper:${{ matrix.symfony }}"
          composer update --with-all-dependencies --no-interaction --no-progress
      - run: composer show illuminate/http symfony/http-kernel
      - run: vendor/bin/phpunit tests/AdaptersTest.php
      - run: vendor/bin/phpunit

  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: curl, json
          coverage: none
      # Each SDK's CI carries the guard that matches its own failure mode.
      # Here it is that the package installs and works with no Composer
      # dependency at all: everything but ext-curl and ext-json is a suggest,
      # so a webhook receiver or an event reader pulls in nothing.
      - name: no runtime dependencies
        run: |
          composer install --no-dev --no-interaction --quiet
          installed=$(composer show --no-dev --name-only 2>/dev/null | sed '/^$/d' | wc -l)
          if [ "$installed" -ne 0 ]; then
            echo "the package acquired a runtime dependency:"; composer show --no-dev; exit 1
          fi
      # The dist zip Composer installs is `git archive`, so this is exactly
      # what a customer gets: the library, its licence, readme and changelog.
      - name: the package ships only the library
        run: |
          shipped=$(git archive HEAD | tar -t | grep -v -E '^(src/.*|LICENSE|README\.md|CHANGELOG\.md|composer\.json)$' || true)
          if [ -n "$shipped" ]; then
            echo "the package would also ship:"; echo "$shipped"; exit 1
          fi
      - name: the core works without a single vendor package
        run: |
          php -r '
            require "vendor/autoload.php";
            $ok = Fingerly\Webhook::verify(
                secret: "whsec_x",
                payload: "{}",
                timestamp: (string) time(),
                signature: "sha256=".hash_hmac("sha256", time().".{}", "whsec_x"),
            );
            if (!$ok) { fwrite(STDERR, "verification failed\n"); exit(1); }
            new Fingerly\Client("fly_sk_production_ci");
            new Fingerly\Proxy([
                "proxy_key" => "fly_px_production_ci",
                "client_ip" => fn ($r) => "203.0.113.7",
            ]);
            echo "the dependency-free build works", PHP_EOL;
          '
